<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忍者・拗音ゲーム（プロトタイプ v13）</title>
    <!-- 毛筆・和風フォントの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
            background-color: #2c3e50;
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: auto;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 900px;
            background-color: #f5f5dc;
            background-image: radial-gradient(#d2b48c 10%, transparent 11%), radial-gradient(#d2b48c 10%, transparent 11%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            border: 4px solid #5c4033;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        
        /* 各種画面 */
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #game-screen { display: none; justify-content: flex-start; }
        #result-screen { display: none; background: rgba(245, 245, 220, 0.95); z-index: 100; }

        /* --- タイトル画面デザイン --- */
        #title-screen {
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 巻物コンテナ（横幅を約10%拡大の570pxに調整） */
        .scroll-wrapper {
            position: relative;
            width: 570px;
            height: 185px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            z-index: 10;
        }
        .scroll-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: fill;
            pointer-events: none;
        }
        
        .title-text-box {
            position: relative;
            z-index: 2;
            text-align: center;
            font-family: 'Yuji Syuku', 'Yu Mincho', 'HGP行書体', serif;
            color: #1a0f00;
            padding: 0 45px;
        }
        /* 文字の大きさを少し大きく（38px -> 42px, 24px -> 26px） */
        .title-main {
            font-size: 42px;
            font-weight: bold;
            line-height: 1.2;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
            white-space: nowrap;
        }
        .title-sub {
            font-size: 26px;
            font-weight: bold;
            margin-top: 5px;
            letter-spacing: 1px;
            color: #2c1a04;
            white-space: nowrap;
        }

        .ninja-icon {
            position: absolute;
            width: 120px;
            height: 120px;
            object-fit: contain;
            z-index: 5;
            filter: drop-shadow(3px 3px 5px rgba(0,0,0,0.3));
        }
        .ninja-top-left { top: 15px; left: 15px; }
        .ninja-top-right { top: 15px; right: 15px; }
        .ninja-bottom-left { bottom: 15px; left: 15px; }
        .ninja-bottom-right { bottom: 15px; right: 15px; }

        .btn {
            background-color: #e67e22;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 16px 30px;
            margin: 10px;
            border: 3px solid #5c4033;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 0 #d35400;
            transition: all 0.1s;
            max-width: 440px;
            width: 80%;
            text-align: center;
            line-height: 1.4;
            z-index: 10;
        }
        .btn:active { transform: translateY(5px); box-shadow: none; }

        /* HUD */
        #hud {
            width: 100%;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
            font-size: 24px;
            font-weight: bold;
            background: rgba(255,255,255,0.85);
            border-bottom: 2px solid #5c4033;
            z-index: 20;
        }

        /* --- お題エリア専用の背景 --- */
        #wall-bg {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: 320px;
            background-image: url('image/bg_koukasen_color2.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-bottom: 5px solid #3e2723;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.3);
            z-index: 1;
        }
        
        /* 問題の標的 */
        #target {
            position: absolute;
            top: 150px;
            width: 240px;
            height: 240px;
            background-color: #fff;
            border: 6px solid #5c4033;
            border-radius: 28px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 15px;
            z-index: 5;
        }
        #target img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 手裏剣エリア */
        #shurikens {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 20;
        }
        
        .shuriken-btn {
            position: relative;
            width: 180px;
            height: 180px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .shuriken-btn:active { transform: scale(0.92); }
        
        .shuriken-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }
        
        .yoon-text-label {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 900;
            color: #ffeb3b;
            text-shadow: 
                3px 3px 0 #000,
               -3px -3px 0 #000,
                3px -3px 0 #000,
               -3px 3px 0 #000,
                0px 3px 0 #000,
                0px -3px 0 #000,
                3px 0px 0 #000,
               -3px 0px 0 #000;
            pointer-events: none;
        }

        .spin {
            animation: spin-anim 0.15s linear infinite;
        }
        @keyframes spin-anim {
            100% { transform: rotate(360deg); }
        }

        /* 判定エフェクト */
        #effect {
            position: absolute;
            font-size: 160px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.3);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 60;
        }
        #effect.show-circle {
            opacity: 1; color: #e74c3c;
            transform: translate(-50%, -50%) scale(1);
            text-shadow: 0 0 10px #fff;
        }
        #effect.show-cross {
            opacity: 1; color: #2c3e50;
            transform: translate(-50%, -50%) scale(1);
            text-shadow: 0 0 10px #fff;
        }

        /* タイムアップ（そこまで！）演出 */
        #timeup-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 90;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #timeup-overlay.show {
            opacity: 1;
            transform: scale(1);
        }
        #timeup-text {
            font-size: 80px;
            font-weight: 900;
            color: #c0392b;
            text-shadow: 
                4px 4px 0 #fff,
               -4px -4px 0 #fff,
                4px -4px 0 #fff,
               -4px 4px 0 #fff,
                0px 5px 15px rgba(0,0,0,0.5);
            background: rgba(255, 255, 255, 0.85);
            padding: 20px 60px;
            border-radius: 30px;
            border: 5px solid #c0392b;
        }
        
        .fall {
            transform: translateY(600px) rotate(360deg) !important;
            opacity: 0;
            transition: all 0.7s ease-in !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- タイトル画面 -->
    <div id="title-screen" class="screen">
        <img src="image/kaginawa.png" class="ninja-icon ninja-top-left" alt="かぎなわ忍者">
        <img src="image/musasabi.png" class="ninja-icon ninja-top-right" alt="むささび忍者">
        <img src="image/kumogakure.png" class="ninja-icon ninja-bottom-left" alt="くもがくれ忍者">
        <img src="image/hasiru.png" class="ninja-icon ninja-bottom-right" alt="はしる忍者">

        <div class="scroll-wrapper">
            <img src="image/makimono.png" class="scroll-bg" alt="巻物">
            <div class="title-text-box">
                <div class="title-main">にんじゃ しゅぎょう</div>
                <div class="title-sub">～ゃゅょのまき～</div>
            </div>
        </div>

        <button class="btn" onclick="startGame(1)">
            ゃゅょ　のどれかな？
        </button>
        <button class="btn" onclick="startGame(2)">
            ゃゅょのまえは　なにかな？
        </button>

        <button id="hint-toggle-btn" class="btn" style="width:auto; padding:8px 20px; font-size:16px; margin-top:10px; background:#7f8c8d;" onclick="toggleHintMode()">
            ひらがなヒント: <span id="hint-toggle-label">なし</span>
        </button>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen">
        <div id="wall-bg"></div>

        <div id="hud">
            <div>のこり: <span id="time-display">60</span>びょう</div>
            <div>スコア: <span id="score-display">0</span></div>
        </div>
        
        <div id="target">
            <img id="target-img" src="" alt="問題画像">
            <div id="word-hint" style="display:none; position:absolute; top:100%; left:0; width:100%; margin-top:8px; text-align:center; font-size:22px; font-weight:bold; color:#333; background:rgba(255,255,255,0.9); border-radius:10px; padding:4px 6px; box-sizing:border-box; white-space:nowrap;"></div>
        </div>
        
        <div id="shurikens"></div>
        <div id="effect"></div>
        
        <!-- タイムアップ演出表示用 -->
        <div id="timeup-overlay"><div id="timeup-text">そこまで！</div></div>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="screen">
        <h1>しゅぎょう おわり！</h1>
        <h2 style="font-size: 28px; margin: 10px 0;">スコア: <span id="final-score">0</span> てん</h2>
        <h3 id="rank-text" style="font-size: 36px; color: #c0392b; margin-bottom: 30px;"></h3>
        <button class="btn" onclick="backToTitle()">もういちど あそぶ</button>
    </div>
</div>

<script src="words.js"></script>
<script>
    const yoonKanaMap = {
        "kya": "きゃ", "kyu": "きゅ", "kyo": "きょ",
        "sya": "しゃ", "syu": "しゅ", "syo": "しょ",
        "tya": "ちゃ", "tyu": "ちゅ", "tyo": "ちょ"
    };

    const SYURIKEN_IMG = "image/syuriken.png";

    // --- 効果音の設定＆音量調整（デフォルト音量を30%に設定） ---
    const seCorrect = new Audio('se_correct.mp3');
    const seWrong = new Audio('se_wrong.mp3');
    seCorrect.volume = 0.3; // 音量を30%に設定
    seWrong.volume = 0.3;   // 音量を30%に設定

    function playCorrectSE() {
        seCorrect.currentTime = 0;
        seCorrect.play().catch(e => console.log("Audio play error:", e));
    }

    function playWrongSE() {
        seWrong.currentTime = 0;
        seWrong.play().catch(e => console.log("Audio play error:", e));
    }

    // 単語データは words.js の WORD_DATA を使用（{ word, image, correct }の配列）

    let isPlaying = false;
    let isThrowing = false;
    let isTargetStopped = false;
    let currentMode = 1;
    let score = 0;
    let timeLeft = 60;
    let currentQuestion = null;
    let timerInterval = null;
    
    let targetX = 0;
    const targetY = 150;
    const TARGET_WIDTH = 240;
    const TARGET_HEIGHT = 240;
    let targetSpeed = 0;
    let lastTime = 0;
    const TOTAL_TIME = 9.0;

    function update(timestamp) {
        if (!isPlaying) return;
        
        let dt = (timestamp - lastTime) / 1000;
        if (dt > 0.1) dt = 0.1;
        lastTime = timestamp;

        if (!isTargetStopped) {
            targetX -= targetSpeed * dt;
            const targetEl = document.getElementById('target');
            targetEl.style.left = targetX + 'px';

            if (targetX < -TARGET_WIDTH) {
                score = Math.max(0, score - 10);
                updateHUD();
                nextQuestion();
            }
        }

        requestAnimationFrame(update);
    }

    function startGame(mode) {
        currentMode = mode;
        score = 0;
        timeLeft = 60;
        isPlaying = true;
        isThrowing = false;
        isTargetStopped = false;
        
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        document.getElementById('timeup-overlay').className = '';
        
        updateHUD();
        nextQuestion();
        
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(!isPlaying) return;
            timeLeft--;
            updateHUD();
            if(timeLeft <= 0) {
                endGame();
            }
        }, 1000);

        lastTime = performance.now();
        requestAnimationFrame(update);
    }

    function updateHUD() {
        document.getElementById('time-display').innerText = timeLeft;
        document.getElementById('score-display').innerText = score;
    }

    function getFixedChoices(correctKey, mode) {
        const base = correctKey.slice(0, 2);
        const vowel = correctKey.slice(2);

        if (mode === 1) {
            return [base + "a", base + "u", base + "o"];
        } else {
            return ["ky" + vowel, "sy" + vowel, "ty" + vowel];
        }
    }

    function nextQuestion() {
        if(!isPlaying) return;
        isThrowing = false;
        isTargetStopped = false;
        
        currentQuestion = WORD_DATA[Math.floor(Math.random() * WORD_DATA.length)];
        
        const targetImg = document.getElementById('target-img');
        targetImg.src = "image/" + currentQuestion.image;

        const hintEl = document.getElementById('word-hint');
        hintEl.innerText = getMaskedWord(currentQuestion);
        hintEl.style.display = hintMode ? 'block' : 'none';
        
        const containerWidth = document.getElementById('game-container').clientWidth;
        
        targetX = containerWidth - TARGET_WIDTH - 15;
        targetSpeed = (targetX + TARGET_WIDTH) / TOTAL_TIME;
        
        const targetEl = document.getElementById('target');
        targetEl.style.left = targetX + 'px';

        const choices = getFixedChoices(currentQuestion.correct, currentMode);

        const shurikensDiv = document.getElementById('shurikens');
        shurikensDiv.innerHTML = '';
        
        choices.forEach(choice => {
            const btn = document.createElement('div');
            btn.className = 'shuriken-btn';
            btn.onclick = () => throwShuriken(btn, choice);
            
            const bgImg = document.createElement('img');
            bgImg.src = SYURIKEN_IMG;
            bgImg.className = 'shuriken-img';
            
            const textLabel = document.createElement('div');
            textLabel.className = 'yoon-text-label';
            textLabel.innerText = yoonKanaMap[choice] || choice;
            
            btn.appendChild(bgImg);
            btn.appendChild(textLabel);
            shurikensDiv.appendChild(btn);
        });
    }

    function throwShuriken(btnElement, choice) {
        if (isThrowing || !isPlaying || isTargetStopped) return;
        isThrowing = true;

        const containerRect = document.getElementById('game-container').getBoundingClientRect();
        const btnRect = btnElement.getBoundingClientRect();

        const clone = btnElement.cloneNode(true);
        const startX = btnRect.left - containerRect.left;
        const startY = btnRect.top - containerRect.top;
        
        clone.style.position = 'absolute';
        clone.style.left = startX + 'px';
        clone.style.top = startY + 'px';
        clone.style.transition = 'all 1.0s linear';
        clone.style.zIndex = '30';
        
        clone.querySelector('.shuriken-img').classList.add('spin');
        
        document.getElementById('game-screen').appendChild(clone);
        btnElement.style.opacity = '0';
        btnElement.style.pointerEvents = 'none';

        const flightTime = 1.0;
        const targetCenterX_1s = (targetX - (targetSpeed * flightTime)) + (TARGET_WIDTH / 2);
        const targetCenterY = targetY + (TARGET_HEIGHT / 2);

        const shurikenRadius = 90;
        const impactX = targetCenterX_1s - shurikenRadius;
        const impactY = targetCenterY - shurikenRadius;

        requestAnimationFrame(() => {
            clone.style.left = impactX + 'px';
            clone.style.top = impactY + 'px';
        });

        setTimeout(() => {
            checkHit(choice, clone);
        }, 1000);
    }

    function checkHit(choice, cloneElement) {
        const currentTargetCenterX = targetX + (TARGET_WIDTH / 2);
        const currentTargetCenterY = targetY + (TARGET_HEIGHT / 2);

        const effectEl = document.getElementById('effect');
        effectEl.style.left = currentTargetCenterX + 'px';
        effectEl.style.top = currentTargetCenterY + 'px';

        if (choice === currentQuestion.correct) {
            isTargetStopped = true;
            playCorrectSE();
            effectEl.innerText = '〇';
            effectEl.className = 'show-circle';
            
            const remainingRatio = Math.max(0, targetX / 800); 
            const bonus = Math.floor(remainingRatio * 30);
            score += 10 + bonus;
            
            cloneElement.remove();
            updateHUD();

            setTimeout(() => {
                effectEl.className = '';
                if (isPlaying) {
                    nextQuestion();
                }
            }, 800);

        } else {
            playWrongSE();
            effectEl.innerText = '✖';
            effectEl.className = 'show-cross';
            
            score = Math.max(0, score - 15);
            
            cloneElement.style.transition = 'all 0.7s ease-in';
            cloneElement.classList.add('fall');
            setTimeout(() => cloneElement.remove(), 700);

            updateHUD();

            setTimeout(() => {
                effectEl.className = '';
                if (isPlaying && !isTargetStopped) {
                    isThrowing = false;
                }
            }, 400);
        }
    }

    function endGame() {
        isPlaying = false;
        if(timerInterval) clearInterval(timerInterval);

        const timeupOverlay = document.getElementById('timeup-overlay');
        timeupOverlay.className = 'show';

        setTimeout(() => {
            timeupOverlay.className = '';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
            
            document.getElementById('final-score').innerText = score;
            
            let rank = "";
            if (score >= 400) rank = "🥷 にんじゃ マスター！";
            else if (score >= 250) rank = "⚔️ いちにんまえ にんじゃ！";
            else if (score >= 100) rank = "📜 みならい にんじゃ！";
            else rank = "🐣 にんじゃの たまご！";
            
            document.getElementById('rank-text').innerText = rank;
        }, 1200);
    }

    function backToTitle() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('title-screen').style.display = 'flex';
    }

    // --- ひらがなヒント機能 ---
    // 拗音（きゃ/しゃ/ちゃ など）の部分を「○○」に置きかえて単語を表示する
    let hintMode = false;

    const YOON_VARIANTS = {
        kya: ["きゃ", "キャ"], kyu: ["きゅ", "キュ"], kyo: ["きょ", "キョ"],
        sya: ["しゃ", "シャ"], syu: ["しゅ", "シュ"], syo: ["しょ", "ショ"],
        tya: ["ちゃ", "チャ"], tyu: ["ちゅ", "チュ"], tyo: ["ちょ", "チョ"]
    };

    function getMaskedWord(item) {
        const variants = YOON_VARIANTS[item.correct] || [];
        for (const v of variants) {
            if (item.word.includes(v)) {
                return item.word.replace(v, "○○");
            }
        }
        return item.word; // 万が一見つからない場合はそのまま表示
    }

    function toggleHintMode() {
        hintMode = !hintMode;
        document.getElementById('hint-toggle-label').innerText = hintMode ? "あり" : "なし";
        const hintEl = document.getElementById('word-hint');
        if (hintEl) hintEl.style.display = hintMode ? 'block' : 'none';
    }
</script>
</body>
</html>
